name: CI

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]

jobs:
   lint-typecheck:
      name: Lint & Typecheck
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm

         - run: npm ci
         - run: npm run typecheck

   test-server:
      name: Server Unit Tests
      runs-on: ubuntu-latest
      services:
         postgres:
            image: postgres:16-alpine
            env:
               POSTGRES_USER: artfolio
               POSTGRES_PASSWORD: artfolio
               POSTGRES_DB: artfolio
            ports: ['5432:5432']
            options: >-
               --health-cmd pg_isready
               --health-interval 10s
               --health-timeout 5s
               --health-retries 5
         redis:
            image: redis:7-alpine
            ports: ['6379:6379']
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm

         - run: npm ci

         - name: Run migrations
           working-directory: server
           env:
              DATABASE_URL: postgresql://artfolio:artfolio@localhost:5432/artfolio
           run: npm run db:migrate

         - name: Run server tests
           working-directory: server
           env:
              DATABASE_URL: postgresql://artfolio:artfolio@localhost:5432/artfolio
              REDIS_URL: redis://localhost:6379
              JWT_ACCESS_SECRET: ci_secret
              JWT_REFRESH_SECRET: ci_secret_refresh
           run: npm test

   test-web:
      name: Frontend Unit Tests
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm

         - run: npm ci

         - name: Run web tests
           working-directory: client
           run: npm test
